# Nothing was watching dependencies here: no dependabot, no renovate, no
# `schedule:` trigger on any workflow, and no `npm audit` step — so between
# 2026-06 and 2026-09 nothing checked them even once.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps; anything major still lands on its own.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
